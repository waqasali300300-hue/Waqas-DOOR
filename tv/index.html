<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>Free TV</title>
<!--
  Free TV — legal free channels and movies only.
  Live TV:  public free-to-air streams listed by the iptv-org project
            (https://github.com/iptv-org/iptv). No paid/pirated channels.
  Movies:   public-domain and freely licensed films from the Internet Archive
            (https://archive.org/details/feature_films).
-->
<style>
  :root {
    --bg: #0b0f17; --panel: #141a26; --panel2: #1c2433; --text: #e8edf5;
    --muted: #8b97ab; --accent: #ff4d5e; --accent2: #3aa0ff; --border: #263044;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 12px 16px 8px; border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; }
  .brand span { color: var(--accent); }
  .brand .home { margin-left: auto; font-size: 14px; font-weight: 600; color: var(--text); text-decoration: none;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  .tabs { display: flex; gap: 8px; margin-top: 10px; }
  .tab { flex: 1; padding: 10px; border: 1px solid var(--border); background: var(--panel);
    color: var(--text); border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .tab.on { background: var(--accent); border-color: var(--accent); }
  .controls { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .controls input, .controls select { flex: 1 1 140px; min-width: 0; padding: 10px; font-size: 15px;
    border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  main { padding: 12px 16px 40px; }
  .status { color: var(--muted); font-size: 14px; margin: 6px 0 12px; }
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; cursor: pointer; position: relative; text-align: left; color: inherit;
    padding: 0; font: inherit; }
  .card:hover, .card:focus-visible { border-color: var(--accent2); outline: none; }
  .thumb { width: 100%; aspect-ratio: 16/10; background: var(--panel2); display: flex;
    align-items: center; justify-content: center; overflow: hidden; }
  .thumb img { max-width: 80%; max-height: 80%; object-fit: contain; }
  .movies .thumb { aspect-ratio: 2/3; }
  .movies .thumb img { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: cover; }
  .thumb .ph { font-size: 28px; font-weight: 700; color: var(--muted); }
  .meta { padding: 8px 10px; }
  .name { font-size: 14px; font-weight: 600; line-height: 1.25; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .fav { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.55); border: 0;
    color: #fff; border-radius: 50%; width: 30px; height: 30px; font-size: 16px; cursor: pointer; }
  .fav.on { color: #ffd34d; }
  .more { display: block; margin: 16px auto 0; padding: 12px 22px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 15px; cursor: pointer; }
  /* player */
  .player { position: fixed; inset: 0; background: #000; z-index: 20; display: none; flex-direction: column; }
  .player.open { display: flex; }
  .pbar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #000;
    padding-top: max(10px, env(safe-area-inset-top)); }
  .pbar button { background: var(--panel2); color: #fff; border: 0; border-radius: 8px;
    padding: 8px 12px; font-size: 15px; cursor: pointer; }
  .ptitle { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pbody { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
  .pbody video, .pbody iframe { width: 100%; height: 100%; border: 0; background: #000; }
  .perr { position: absolute; inset: auto 16px 20px; background: rgba(20,26,38,.95); padding: 12px;
    border-radius: 10px; font-size: 14px; display: none; }
  .note { margin-top: 24px; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .note a { color: var(--accent2); }
</style>
</head>
<body>
<header>
  <div class="brand">📺 Free<span>TV</span><a class="home" href="../index.html">🏠 दुकान</a></div>
  <div class="tabs">
    <button class="tab on" data-tab="live">लाइव टीवी</button>
    <button class="tab" data-tab="movies">मूवीज़</button>
    <button class="tab" data-tab="favs">★ पसंदीदा</button>
  </div>
  <div class="controls" id="liveControls">
    <select id="country" aria-label="देश"></select>
    <select id="category" aria-label="कैटेगरी"><option value="">सब कैटेगरी</option></select>
    <input id="liveSearch" type="search" placeholder="चैनल खोजें…">
  </div>
  <div class="controls" id="movieControls" hidden>
    <select id="movieGenre" aria-label="टाइप">
      <option value="">सब मूवीज़</option>
      <option value="comedy">कॉमेडी</option>
      <option value="drama">ड्रामा</option>
      <option value="horror">हॉरर</option>
      <option value="western">वेस्टर्न</option>
      <option value="science fiction">साइंस फ़िक्शन</option>
      <option value="crime">क्राइम</option>
      <option value="animation">कार्टून / एनिमेशन</option>
      <option value="documentary">डॉक्यूमेंट्री</option>
    </select>
    <input id="movieSearch" type="search" placeholder="मूवी खोजें…">
  </div>
</header>

<main>
  <div class="status" id="status">लोड हो रहा है…</div>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden>और दिखाएँ</button>
  <p class="note">
    यहाँ सिर्फ़ वही चैनल हैं जो इंटरनेट पर खुले और मुफ़्त प्रसारित होते हैं
    (<a href="https://github.com/iptv-org/iptv" target="_blank" rel="noopener">iptv-org</a> लिस्ट), और वही मूवीज़
    जो पब्लिक-डोमेन या फ़्री लाइसेंस वाली हैं
    (<a href="https://archive.org/details/feature_films" target="_blank" rel="noopener">Internet Archive</a>).
    कुछ चैनल कभी-कभी बंद हो जाते हैं — तब कोई और चैनल चुनें।
  </p>
</main>

<div class="player" id="player">
  <div class="pbar">
    <button id="close">← वापस</button>
    <div class="ptitle" id="ptitle"></div>
  </div>
  <div class="pbody" id="pbody">
    <div class="perr" id="perr"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
(() => {
  'use strict';
  const IPTV = 'https://iptv-org.github.io/iptv/';
  const COUNTRIES = [
    ['pk', 'पाकिस्तान'], ['in', 'भारत'], ['ae', 'UAE'], ['sa', 'सऊदी अरब'], ['gb', 'UK'],
    ['us', 'अमेरिका'], ['ca', 'कनाडा'], ['au', 'ऑस्ट्रेलिया'], ['tr', 'तुर्की'], ['bd', 'बांग्लादेश'],
    ['af', 'अफ़ग़ानिस्तान'], ['ir', 'ईरान'], ['qa', 'क़तर'], ['eg', 'मिस्र'], ['fr', 'फ़्रांस'],
    ['de', 'जर्मनी'], ['es', 'स्पेन'], ['it', 'इटली'], ['br', 'ब्राज़ील'], ['jp', 'जापान'],
    ['kr', 'कोरिया'], ['cn', 'चीन'], ['ru', 'रूस'], ['id', 'इंडोनेशिया'], ['my', 'मलेशिया']
  ];
  const EXTRA = [
    ['categories/news', '🌍 दुनिया — न्यूज़'], ['categories/movies', '🌍 दुनिया — मूवी चैनल'],
    ['categories/sports', '🌍 दुनिया — स्पोर्ट्स'], ['categories/kids', '🌍 दुनिया — बच्चे'],
    ['categories/music', '🌍 दुनिया — म्यूज़िक'], ['categories/religious', '🌍 दुनिया — मज़हबी'],
    ['languages/urd', '🗣 उर्दू भाषा'], ['languages/hin', '🗣 हिंदी भाषा'],
    ['languages/pan', '🗣 पंजाबी भाषा'], ['languages/ara', '🗣 अरबी भाषा'],
    ['index', '🌐 पूरी दुनिया (सब चैनल)']
  ];
  const PAGE = 60;

  const $ = id => document.getElementById(id);
  const grid = $('grid'), statusEl = $('status'), moreBtn = $('more');
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  let favs = store.get('ftv-favs', []);
  let tab = 'live', channels = [], liveShown = 0, liveFiltered = [];
  let movies = [], moviePage = 1, movieTotal = 0, movieQueryKey = '';
  const m3uCache = {};

  // ---------- helpers ----------
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const isFav = key => favs.some(f => f.key === key);
  function toggleFav(item) {
    favs = isFav(item.key) ? favs.filter(f => f.key !== item.key) : [...favs, item];
    store.set('ftv-favs', favs);
  }

  function parseM3U(text) {
    const out = []; let cur = null;
    for (const raw of text.split('\n')) {
      const line = raw.trim();
      if (line.startsWith('#EXTINF')) {
        const attr = n => (line.match(new RegExp(n + '="([^"]*)"')) || [])[1] || '';
        cur = { name: line.slice(line.lastIndexOf(',') + 1).trim(), logo: attr('tvg-logo'),
                group: attr('group-title') || 'Other' };
      } else if (cur && line && !line.startsWith('#')) {
        // HTTPS-only: plain http streams are blocked by browsers on secure pages.
        if (line.startsWith('https://')) out.push({ ...cur, url: line, type: 'live', key: 'l:' + line });
        cur = null;
      }
    }
    return out;
  }

  // ---------- rendering ----------
  function card(item) {
    const el = document.createElement('div');
    el.className = 'card'; el.tabIndex = 0; el.setAttribute('role', 'button');
    const initials = esc((item.name || '?').slice(0, 2).toUpperCase());
    el.innerHTML =
      `<div class="thumb">${item.logo ? `<img loading="lazy" alt="" src="${esc(item.logo)}">` : ''}<div class="ph"${item.logo ? ' hidden' : ''}>${initials}</div></div>` +
      `<div class="meta"><div class="name">${esc(item.name)}</div><div class="sub">${esc(item.sub || item.group.replace(/;/g, ', '))}</div></div>` +
      `<button class="fav${isFav(item.key) ? ' on' : ''}" aria-label="पसंदीदा">★</button>`;
    const img = el.querySelector('img');
    if (img) img.onerror = () => { img.remove(); el.querySelector('.ph').hidden = false; };
    el.querySelector('.fav').onclick = e => {
      e.stopPropagation(); toggleFav(item); e.currentTarget.classList.toggle('on', isFav(item.key));
      if (tab === 'favs') renderFavs();
    };
    el.onclick = () => play(item);
    el.onkeydown = e => { if (e.key === 'Enter') play(item); };
    return el;
  }

  function setTab(t) {
    tab = t;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
    $('liveControls').hidden = t !== 'live';
    $('movieControls').hidden = t !== 'movies';
    grid.classList.toggle('movies', t === 'movies');
    store.set('ftv-tab', t);
    if (t === 'live') renderLive(true);
    else if (t === 'movies') { if (!movies.length) loadMovies(true); else renderMovies(); }
    else renderFavs();
  }

  // ---------- live TV ----------
  async function loadPlaylist(path) {
    statusEl.textContent = 'चैनल लोड हो रहे हैं…'; grid.innerHTML = ''; moreBtn.hidden = true;
    try {
      if (!m3uCache[path]) {
        const r = await fetch(IPTV + path + '.m3u');
        if (!r.ok) throw new Error(r.status);
        m3uCache[path] = parseM3U(await r.text());
      }
      channels = m3uCache[path];
      const groups = [...new Set(channels.flatMap(c => c.group.split(';')))].filter(Boolean).sort();
      $('category').innerHTML = '<option value="">सब कैटेगरी</option>' +
        groups.map(g => `<option>${esc(g)}</option>`).join('');
      if (tab === 'live') renderLive(true);
    } catch (e) {
      channels = [];
      statusEl.textContent = 'चैनल लिस्ट नहीं मिली। इंटरनेट चेक करें और दोबारा कोशिश करें।';
    }
  }

  function renderLive(reset) {
    if (reset) {
      const q = $('liveSearch').value.trim().toLowerCase(), cat = $('category').value;
      liveFiltered = channels.filter(c =>
        (!cat || c.group.split(';').includes(cat)) && (!q || c.name.toLowerCase().includes(q)));
      grid.innerHTML = ''; liveShown = 0;
    }
    const next = liveFiltered.slice(liveShown, liveShown + PAGE);
    next.forEach(c => grid.appendChild(card(c)));
    liveShown += next.length;
    statusEl.textContent = liveFiltered.length
      ? `${liveFiltered.length} चैनल` : (channels.length ? 'कोई चैनल नहीं मिला' : statusEl.textContent);
    moreBtn.hidden = liveShown >= liveFiltered.length;
  }

  // ---------- movies (Internet Archive) ----------
  async function loadMovies(reset) {
    const q = $('movieSearch').value.trim(), genre = $('movieGenre').value;
    const key = q + '|' + genre;
    if (reset || key !== movieQueryKey) { movies = []; moviePage = 1; movieQueryKey = key; grid.innerHTML = ''; }
    statusEl.textContent = 'मूवीज़ लोड हो रही हैं…'; moreBtn.hidden = true;
    let query = 'collection:(feature_films) AND mediatype:(movies)';
    if (genre) query += ` AND subject:(${genre})`;
    if (q) query += ` AND title:(${q.replace(/[():"]/g, ' ')})`;
    const params = new URLSearchParams({ q: query, rows: PAGE, page: moviePage, output: 'json', 'sort[]': 'downloads desc' });
    ['identifier', 'title', 'year'].forEach(f => params.append('fl[]', f));
    try {
      const r = await fetch('https://archive.org/advancedsearch.php?' + params);
      const data = await r.json();
      if (key !== movieQueryKey) return; // a newer search started meanwhile
      movieTotal = data.response.numFound;
      const batch = data.response.docs.map(d => ({
        type: 'movie', key: 'm:' + d.identifier, id: d.identifier,
        name: Array.isArray(d.title) ? d.title[0] : (d.title || d.identifier),
        sub: d.year ? String(d.year) : 'मूवी', logo: 'https://archive.org/services/img/' + d.identifier
      }));
      movies.push(...batch); moviePage++;
      if (tab === 'movies') { batch.forEach(m => grid.appendChild(card(m))); renderMovieStatus(); }
    } catch (e) {
      statusEl.textContent = 'मूवीज़ नहीं मिलीं। इंटरनेट चेक करें और दोबारा कोशिश करें।';
    }
  }
  function renderMovieStatus() {
    statusEl.textContent = movieTotal ? `${movieTotal.toLocaleString()} मूवीज़` : 'कोई मूवी नहीं मिली';
    moreBtn.hidden = movies.length >= movieTotal;
  }
  function renderMovies() { grid.innerHTML = ''; movies.forEach(m => grid.appendChild(card(m))); renderMovieStatus(); }

  // ---------- favourites ----------
  function renderFavs() {
    grid.innerHTML = ''; moreBtn.hidden = true;
    grid.classList.remove('movies');
    favs.forEach(f => grid.appendChild(card(f)));
    statusEl.textContent = favs.length ? `${favs.length} पसंदीदा` : 'अभी कुछ नहीं — किसी चैनल या मूवी पर ★ दबाएँ।';
  }

  // ---------- player ----------
  let hls = null;
  function stop() {
    if (hls) { hls.destroy(); hls = null; }
    $('pbody').querySelectorAll('video,iframe').forEach(n => n.remove());
    $('perr').style.display = 'none';
  }
  function showErr(msg) { const e = $('perr'); e.textContent = msg; e.style.display = 'block'; }
  function play(item) {
    stop();
    $('ptitle').textContent = item.name;
    $('player').classList.add('open');
    history.pushState({ player: 1 }, '');
    const body = $('pbody');
    if (item.type === 'movie') {
      const f = document.createElement('iframe');
      f.src = 'https://archive.org/embed/' + encodeURIComponent(item.id);
      f.allow = 'autoplay; fullscreen'; f.allowFullscreen = true;
      body.prepend(f);
      return;
    }
    const v = document.createElement('video');
    v.controls = true; v.autoplay = true; v.playsInline = true;
    body.prepend(v);
    const fail = () => showErr('यह चैनल अभी नहीं चल रहा। वापस जाकर कोई और चैनल चुनें।');
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ manifestLoadingMaxRetry: 2 });
      hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) fail(); });
      hls.loadSource(item.url); hls.attachMedia(v);
    } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
      v.src = item.url; v.onerror = fail;
    } else { v.src = item.url; v.onerror = fail; }
    v.play().catch(() => {});
  }
  function closePlayer() { stop(); $('player').classList.remove('open'); }
  $('close').onclick = () => history.back();
  window.addEventListener('popstate', () => { if ($('player').classList.contains('open')) closePlayer(); });

  // ---------- wiring ----------
  const sel = $('country');
  sel.innerHTML = COUNTRIES.map(([c, n]) => `<option value="countries/${c}">${n}</option>`).join('') +
    '<option disabled>──────────</option>' +
    EXTRA.map(([p, n]) => `<option value="${p}">${n}</option>`).join('');
  sel.value = store.get('ftv-src', 'countries/pk');
  if (!sel.value) sel.value = 'countries/pk';
  sel.onchange = () => { store.set('ftv-src', sel.value); $('liveSearch').value = ''; loadPlaylist(sel.value); };
  $('category').onchange = () => renderLive(true);
  $('liveSearch').oninput = debounce(() => renderLive(true), 200);
  $('movieGenre').onchange = () => loadMovies(true);
  $('movieSearch').oninput = debounce(() => loadMovies(true), 400);
  moreBtn.onclick = () => tab === 'live' ? renderLive(false) : loadMovies(false);
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));

  loadPlaylist(sel.value);
  setTab(store.get('ftv-tab', 'live'));
})();
</script>
</body>
</html>
